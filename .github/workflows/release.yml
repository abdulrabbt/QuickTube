name: Release

# Pushing to `production` publishes a signed APK as a GitHub Release.
# Only the repository owner can push to `production` (enforced by a repository ruleset).
on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      version_code:
        description: "Optional version code override (default: 1 + the highest v* release tag)"
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        env:
          VERSION_CODE_OVERRIDE: ${{ inputs.version_code }}
        run: |
          base=$(grep -E '^appVersionBase=' gradle.properties | cut -d= -f2)
          if [ -n "$VERSION_CODE_OVERRIDE" ]; then
            case "$VERSION_CODE_OVERRIDE" in
              *[!0-9]*) echo "::error::version_code must be a number, got '$VERSION_CODE_OVERRIDE'"; exit 1 ;;
            esac
            code=$VERSION_CODE_OVERRIDE
          else
            # One more than the last number of the newest app release tag (v1.0.8 -> versionCode 8).
            # desktop-v* and ffmpeg-video-* tags are not app releases.
            last=$(git tag --list 'v*' | grep -vE '^(desktop-v|ffmpeg-video-)' | grep -oE '[0-9]+$' | sort -n | tail -1 || true)
            code=$(( ${last:-0} + 1 ))
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$base.$code" >> "$GITHUB_OUTPUT"
          echo "Releasing $base.$code (versionCode $code)"

      - name: Restore signing key and Firebase config
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON not set; building without Firebase"
          fi

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # --no-configuration-cache: KSP's processor classpath isn't cacheable on a cold runner
          # (Gradle 9.9 + AGP + KSP2), which would fail the build before it starts.
          ./gradlew :app:assembleRelease --no-parallel --stacktrace --no-configuration-cache \
            -PappVersionCode=${{ steps.version.outputs.code }} \
            -PappVersionName=${{ steps.version.outputs.name }}

      - name: Verify signatures and collect the APKs
        env:
          EXPECTED_CERT_SHA256: ${{ vars.EXPECTED_CERT_SHA256 }}
        run: |
          dir=app/build/outputs/apk/release
          ls -la "$dir"
          # Newest build-tools that actually ships apksigner.
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          [ -n "$apksigner" ] || { echo "::error::apksigner not found in $ANDROID_HOME/build-tools"; exit 1; }
          echo "Using $apksigner"
          if [ -z "$EXPECTED_CERT_SHA256" ]; then
            echo "::warning::EXPECTED_CERT_SHA256 repository variable is not set; the owner should set it to the release key's certificate SHA-256, otherwise a wrong signing key is not refused"
          fi
          mkdir -p dist
          # One APK per CPU type plus a universal one (same version code; the in-app updater picks by CPU).
          for abi in arm64-v8a armeabi-v7a universal; do
            src="$dir/app-$abi-release.apk"
            [ -f "$src" ] || { echo "::error::$src not found (an unsigned build would end in -unsigned.apk)"; exit 1; }
            if ! report=$("$apksigner" verify --verbose --print-certs "$src" 2>&1); then
              echo "$report"; echo "::error::$src signature verification failed"; exit 1
            fi
            # Output differs between build-tools versions ("Signer #1 certificate …" vs "V2 Signer: certificate …").
            digest=$(echo "$report" | grep -m1 -oE "certificate SHA-256 digest: [0-9a-f]{64}" | awk '{print $NF}')
            echo "$abi signed with certificate SHA-256: ${digest:-none}"
            # The expected fingerprint of the release key is a repository variable (public; not a secret).
            if [ -n "$EXPECTED_CERT_SHA256" ] && [ "$digest" != "$EXPECTED_CERT_SHA256" ]; then
              echo "$report"; echo "::error::$src is not signed with the expected QuickTube release key"; exit 1
            fi
            # Some phones' installers (vivo…) refuse an APK without the v1 JAR signature: "missing the developer certificate".
            # (apksigner skips v1 for minSdk 24+, so check as if for Android 6, like those installers do.)
            if ! v1=$("$apksigner" verify --verbose --min-sdk-version 23 "$src" 2>&1) || ! echo "$v1" | grep -q "v1 scheme (JAR signing): true"; then
              echo "$v1"; echo "::error::$src has no valid v1 (JAR) signature"; exit 1
            fi
            if [ "$abi" = universal ]; then out="QuickTube-v${{ steps.version.outputs.name }}.apk"
            else out="QuickTube-v${{ steps.version.outputs.name }}-$abi.apk"; fi
            cp "$src" "dist/$out"
            (cd dist && sha256sum "$out" > "$out.sha256")
          done
          ls -la dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.name }}"
          universal="dist/QuickTube-$tag.apk"
          # The previous Android release: skip prereleases (the video decoder pack) and desktop-v* releases.
          prev=$(gh release list --exclude-pre-releases --limit 50 --json tagName -q '[.[].tagName | select(startswith("v"))][0] // empty' 2>/dev/null || true)
          args=(--target "${{ github.sha }}" --title "QuickTube $tag" --generate-notes)
          [ -n "$prev" ] && args+=(--notes-start-tag "$prev")
          # Built as a draft (invisible to apps), universal APK uploaded last, one file at a time: versions up to
          # 1.0.3 take the last .apk / .apk.sha256 asset. Published only once everything is there.
          gh release create "$tag" dist/*-arm64-v8a.apk* dist/*-armeabi-v7a.apk* --draft "${args[@]}"
          gh release upload "$tag" "$universal"
          gh release upload "$tag" "$universal.sha256"
          gh release edit "$tag" --draft=false --latest

      - name: Clean up secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" app/google-services.json
